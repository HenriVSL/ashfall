smoothUp=0.5
; ... towards a SMALLER new value (1 = at once: honesty first) (0.05..1)
smoothDown=1.0
; live snapshot predicted ahead by this fraction of the last cycle time (both aircraft keep turning): less lag (0..1.5)
leadFrac=0.5
; cut a fly-out short once it can no longer reach the target (sure miss) (0/1)
