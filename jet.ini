; wing-top vapour sheet opacity at 8.5 g (from 6 g); 0 = off (0..1)
vapourSheet=0.55
; transonic vapour cone opacity at Mach 1.0; 0 = off (0..1)
vapourCone=0.5
; vapour cone Mach band half width (bell around Mach 1.0) (0.005..0.3)
vapourConeMachW=0.035
; T22: engine contrails at high altitude (0/1)
contrail=1
; contrails above this altitude (m; fade in over the 600 m below) (0..30000)
contrailAltM=8000
; contrail opacity (0..1)
contrailAlpha=0.85
; contrail width when old (m; 1 m at the nozzle) (1..60)
contrailWidthEnd=12
; contrails drawn within this range (m) (0..40000)
contrailDistM=15000
; contrail lifetime (s); 0 = preset (Low 6, High 12) (0..60)
contrailSecs=0
; explosion size scale (arcade; T17 used 1.5) (0.5..4)
explScale=1.7
; T22: explosion layers: secondary fire blooms, fireball turning into soot, burning debris trails (0/1)
explLayers=1
; burning debris pieces per kill; -1 = preset (Low 3, High 5) (-1..8)
burnDebris=-1
; T22: smoke column where a wreck hits the ground or sea (crash sites too) (0/1)
column=1
; smoke column duration on land (s; half on the sea); 0 = preset (Low 20, High 35) (0..120)
columnSecs=0
; smoke column rise speed (m/s) (0..40)
columnRise=11
; smoke drifts toward this heading (deg) (0..360)
windDeg=60
; smoke drift speed (m/s) (0..30)
windMs=4
; T22: haze opacity deep inside a cloud puff (the puff itself fades out near the camera) (0..1)
cloudHaze=0.7
; cloud wisps streaming past near / inside a cloud; -1 = preset (Low 6, High 12) (-1..16)
cloudWisps=-1
; cloud wisp opacity (0..1)
wispAlpha=0.45
; T22: three shock diamonds in the afterburner flame (0/1)
flameDiamonds=1
; shock diamond brightness (0..2)
diamondBright=0.55
; camera shake (deg) from an explosion at the camera, gone by 700 m; hits on the own jet 1.2 x ([camera] shakeExpl scales) (0..5)
shakeExplDeg=0.8

[scatter]
; A11 island vegetation / rock / village sprites (data/island/veg.sct) (0/1)
on=1
; sprites drawn within this distance (m); 0 = preset (Low 1600, High 3500) (0..8000)
rangeM=0
; cap per frame, nearest kept; 0 = preset (Low 600, High 2400) (0..4096)
maxSprites=0
; full density up to this fraction of the range (0..1)
nearFrac=0.35
; density at the range (thinned in between); 0 = preset (Low 0.35, High 0.6) (0..1)
farDensity=0
; sprites grow in from zero over this outer fraction of the range (0.01..1)
fadeFrac=0.15
; camera-facing cards lean back by this x the view elevation (max 35 deg) (0..1)
tiltK=0.5
; sprite brightness x the baked terrain light (0.3..2)
bright=1.0

[controls]
pitchUp=key UP, none, none
pitchDown=key DOWN, none, none
rollLeft=key LEFT, none, none
rollRight=key RIGHT, none, none
fast=key A, none, none
slow=key Z, none, none
target=key S, none, none
fire=key SPACE, none, none
weapon=key D, none, none
flare=key F, none, none
view=key C, none, none
look=key V, none, none
mapRange=key TAB, none, none
pause=key ESC, key P, none
stickX=none, none, j0 x
stickY=none, none, j0 y
