; jet.ini - every tunable with its default (generated by jet.exe -dumpini, DESIGN 2.5).
; Edit a value and press F5 in the game to reload it live ([video] needs a restart).
; Bad values are clamped to the range shown and logged in jet.log; a removed key = its default.

[video]
; 1 = fullscreen, 0 = window (-window / -fullscreen) (0/1) [restart]
fullscreen=1
; screen width in pixels (-res W H); 800x600 = Low on the VM (minimum) (320..2048) [restart]
width=800
; screen height in pixels (the T40 target: 1400x1050) (240..1536) [restart]
height=600
; colour depth 16 or 32 (16..32) [restart]
bpp=16
; low (VM, 30 fps) or high (real PC, 60 fps) (-preset) [restart]
preset=low
; frame rate cap; 0 = from the preset (low 30, high 60) (0..120) [restart]
fpsTarget=0
; use the W-buffer when the card has one (DESIGN 9.1) (0/1) [restart]
wbuffer=1
; fps overlay at start (F11 toggles; -fps) (0/1) [restart]
showFps=0

[pilot]
; pitch axis first stage (fine aiming): the axis moves at pitchRateFine up to this value, then at pitchRate (0 = one stage) (0..1)
pitchFine=0.35
; pitch axis speed in the first stage (axis/s): 3.0 = 0 -> 0.35 in 0.12 s; lower = finer taps (0.1..50)
pitchRateFine=3.0
; pitch axis speed after the first stage (axis/s): 1.8 = 0.35 -> 1 in 0.36 s (full pull after ~0.5 s hold) (0.1..50)
pitchRate=1.8
; pitch axis speed back to 0 when the key is let go (axis/s): 6 = full -> 0 in 0.17 s (0.1..100)
pitchReturn=6.0
; pitch axis speed back to 0 when the opposite key is pressed (axis/s) (0.1..100)
pitchCross=8.0
; roll axis speed towards the pressed side (axis/s): 6 = full roll command in 0.17 s (0.1..100)
rollRateIn=6.0
; roll axis speed back to 0 when the key is let go (axis/s): high = the bank stops where you leave it (0.1..100)
rollReturn=10.0
; roll axis speed back to 0 when the opposite key is pressed (axis/s) (0.1..100)
rollCross=12.0
; optional roll first stage like pitchFine (0 = off, one stage). Try 0.3 if small bank corrections are too coarse (0..1)
rollFine=0
; roll axis speed in the optional first stage (axis/s, only when rollFine > 0) (0.1..50)
rollRateFine=2.0
; 0 = Up arrow nose UP (default), 1 = Up arrow nose DOWN (flight-sim style) (0/1)
invertPitch=0
; S held this long (ms) = long press (designate); shorter = short press (next target) (50..2000)
longPressMs=300
; F held: one flare burst on the press, then one every this many ms (100..5000)
flareRepeatMs=500
; joystick expo: 0 = linear, 1 = cubic (finer around the centre) (0..1)
joyExpo=0.3
; joystick deadzone (fraction of full travel) (0..0.5)
joyDead=0.05
; expert = true roll + pitch (Left/Right roll, Up/Down pull); novice = Left/Right turn, Up/Down climb/dive (F6 toggles)
mode=expert
; novice: bank angle a held Left/Right turn goes to (deg); more = tighter level turn (10..85)
noviceBankDeg=80
; novice: how firmly the bank is steered to its target (1/s); higher = snappier, lower = softer (0.5..30)
noviceBankGain=5
; novice: fastest automatic roll (deg/s), into a turn and back to wings level (10..360)
noviceRollRateDeg=90
; novice: climb/dive angle change with Up/Down held (deg/s, less when the G limit is reached) (1..60)
noviceGammaRateDeg=15
; novice: steepest climb or dive (deg): no loops, no inverted flight (10..89)
novicePitchLimitDeg=75
; novice: how firmly the climb angle is held (1/s) (0..20)
noviceGammaGain=2.0
; novice: 0 = Up/Down released holds the climb angle, 1 = eases back to level flight (0/1)
noviceAutoLevelPitch=0
; novice with noviceAutoLevelPitch=1: how fast the climb angle eases to level (1/s) (0.05..5)
noviceLevelGain=0.5

[flight]
; G limit (g) vs true airspeed (kt): full pull gives this G. More G = tighter turns at that speed (x:y, y 0.5..20)
gLimitTable=150:4.5,200:6,250:7.5,300:8.5,330:9,700:9,1020:7,2000:6
; multiplies the whole G limit table (global 'how tight'): 1.2 = 20 % tighter turns everywhere (0.2..3)
turnBoost=1.0
; push limit (g) with the nose-down key held (-10..0)
negGLimit=-3.0
; max flight-path pitch rate (deg/s): a safety limit on how fast the nose comes round (the G table limits first) (1..180)
pitchRateCapDeg=40
; G onset lag (s): higher = softer, slower pull (0.005..2)
tauG=0.10
; max roll rate (deg/s) vs true airspeed (kt) (x:y, y 0..720)
rollRateTable=150:110,250:180,400:220,700:200
; roll rate lag (s): higher = rolls start and stop softer (0.005..1)
tauRoll=0.06
; wings-level detent: with no roll key and less bank than this (deg), the wings level themselves (0 = off) (0..20)
detentDeg=4
; detent strength (1/s): how fast it levels (0..20)
detentGain=1.5
; how much a bank turns the jet by itself (gravity's side pull); 0 = banking alone doesn't turn (0..2)
latGrav=1.0
; cruise speed with no throttle key (Mach) (0.3..2)
machNormal=0.80
; A held (afterburner) speed (Mach) (0.3..2.5)
machFast=1.60
; Z held: speed brake down to this (kt), then slow bleed (100..800)
vManKt=350
; speed floor (kt): the jet never flies slower (50..400)
vFloorKt=150
; Z: the speed brake fades out over this band (kt) above vManKt (no jolt at 350 kt) (0.5..100)
vManBandKt=10
; max acceleration at normal power (m/s^2) (0.1..50)
accMil=6
; max acceleration in afterburner (m/s^2) (0.1..80)
accAB=18
; deceleration when faster than the throttle target, e.g. after letting go of A or after a dive (m/s^2) (0.1..80)
decOver=15
; Z: speed brake deceleration above vManKt (m/s^2) (0.1..100)
decBrake=28
; Z: slow bleed from vManKt down to the floor (m/s^2) (0.1..50)
decSlow=2.5
; how softly the speed settles on its target (s) (0.1..30)
tauV=2.5
; climbs cost speed, dives give speed (1 = gravity, 0 = none) (0..2)
energyTrade=1.0
; speed bleed per g above 1 g in hard turns (m/s^2 per g) (0..10)
inducedPerG=0.9
; hard speed limit (Mach) (0.5..3)
vMaxMach=2.0
; near the speed floor (this many kt above it) a climbing nose starts to sink (1..200)
floorBandKt=20
; how fast the nose sinks towards the horizon at the speed floor or above the ceiling (deg/s) (0..90)
floorDropDeg=8
; full engine thrust up to this altitude (m); above it the thrust fades as the air thins (0..20000)
thrustFullM=6000
; service ceiling (m): no thrust left here, so climbing fades out by itself; a zoom coasts a bit higher (2000..30000)
ceilingM=15500
; thrust ~ air density^this between thrustFullM and ceilingM (shape of the fade; 0.7 = jet engine) (0.1..4)
thrustLapseExp=0.7
; above ceilingM the jet slowly loses speed (m/s^2, full 1 km above and 200 kt over the floor, 0 at the floor speed): dives always gain (0..1.5)
thinAirDecel=0.5
; above ceilingM climbing costs extra: per 1000 m above it, this many extra times gravity's cost of the climb (ends zoom climbs smoothly; never acts in level flight or dives) (0..10)
zoomDrag=3.0
; look only: nose angle above the flight path at 1 g and alphaRefKt (deg) (0..20)
alpha1gDeg=2.0
; look only: reference speed for alpha1gDeg (kt) (50..1000)
alphaRefKt=300
; look only: lowest angle of attack (deg) (-30..0)
alphaMinDeg=-6
; look only: highest angle of attack (deg) (0..45)
alphaMaxDeg=20
; look only: angle of attack lag (s) (0.005..2)
tauAlpha=0.15
; look only: stabilator travel for full pull/push (deg) (0..45)
stabMaxDeg=20
; look only: differential stabilator for full roll (deg) (0..30)
stabRollDeg=8
; look only: flaperon travel for full roll (deg) (0..45)
flapMaxDeg=20
; look only: control surface movement lag (s) (0.005..1)
surfTau=0.08
; afterburner flame/sound level 0 -> 1 time (s) (0.01..5)
abOnSec=0.3
; afterburner flame/sound level 1 -> 0 time (s) (0.01..5)
abOffSec=0.6
; speed brake open/close time (s) (0.01..5)
brakeSec=0.5

[takeoff]
; takeoff roll acceleration after a tap of A (m/s^2) (0.5..50)
rollAccMil=7
; takeoff roll acceleration while A is held (afterburner, m/s^2) (0.5..50)
rollAccAB=11
; the nose starts to come up at this speed (kt) (50..300)
vRotateKt=145
; nose attitude at the end of the rotation (deg above the horizon) (0..25)
rotatePitchDeg=10
; rotation time (s) (0.1..10)
rotateSec=1.5
; liftoff speed (kt): from here the flight model flies (never below the speed floor) (50..300)
vLiftKt=160
; automatic climb-out: flight path angle (deg) (1..45)
climbPitchDeg=12
; automatic climb-out: how fast the climb angle builds up after liftoff (deg/s) (0.2..30)
climbGammaRateDeg=3
; automatic climb-out: most bank used to stay on the runway centre line (deg) (0..60)
climbBankDeg=15
; automatic climb-out: bank per heading error (rad/rad) while holding the centre line (0.1..20)
climbHdgGain=8
; automatic climb-out: heading correction per metre off the extended centre line (deg/m) (0..10)
trackGainDeg=0.15
; automatic climb-out: largest heading correction towards the centre line (deg) (0..45)
trackMaxDeg=10
; gear starts to retract at this height above ground (ft) (0..2000)
gearUpFt=50
; gear retraction time (s) (0.1..20)
gearSec=3
; the autopilot hands over at this height above ground (ft) ... (100..20000)
handoverFt=1500
; ... and at this speed (kt) (150..1000)
handoverKt=300
; YOU HAVE CONTROL message time (s) (0..10)
handoverMsgSec=2
; the autopilot's stick fades into yours over this time at the handover (s) (0..5)
handoverBlendSec=0.5
; climb-out: a pitch/roll key held this long (s) takes control at once ... (0..5)
overrideSec=0.25
; ... once higher than this above the ground (ft) (0..5000)
overrideMinFt=200
; jet centre above the runway with the wheels on it (m; A1 mesh: 2.05) (0..10)
gearHeightM=2.05
; autopilot (climb-out, area turn-back): bank per heading error (rad/rad) (0.1..20)
apHdgGain=2.0
; autopilot: roll rate per bank error (1/s) (0.1..30)
apBankGain=3.0
; autopilot: fastest roll (deg/s) (5..360)
apRollRateDeg=90
; autopilot: climb angle rate per climb angle error (1/s) (0.1..20)
apGammaGain=1.5
; autopilot: fastest climb angle change (deg/s) (0.5..60)
apGammaRateDeg=6

[world]
; crash when the jet's centre comes this close to the ground or sea (m) while flying (0..20)
crashClearM=1.5
; jet sphere radius against the hangar/tower/tank boxes (m) (0..50)
boxRadiusM=5
; jet sphere radius for aircraft-aircraft collisions (m): two jets collide when their centres pass closer than 2x this (0..50)
acRadiusM=6
; after a crash: wreck camera time before the restart on the runway (s) (0..30)
wreckSec=2.5
; RETURN TO AREA warning beyond this distance from the island centre (km) (1..100)
areaWarnKm=75
; the autopilot turns the jet back beyond this distance from the island centre (km) (1..100)
areaTurnKm=90
; automatic turn-back ends when the heading is within this many degrees of the island centre (1..180)
turnbackDoneDeg=30
; bank angle of the automatic turn-back (deg; less if the G limit can't hold a level turn at that bank) (10..85)
turnbackBankDeg=75
; PULL UP when the ground or sea is predicted within this many seconds on the current flight path (0.5..20)
pullUpSec=4
; PULL UP goes off when the predicted impact is this much later than pullUpSec (s, avoids flicker) (0..10)
pullUpOffSec=0.5
; no PULL UP below this height (ft above ground) over the runway (low passes) (0..5000)
pullUpRunwayFt=200
; PULL UP predictor sample spacing along the flight path (s; samples out to pullUpSec + 1 s) (0.1..2)
pullUpStepSec=0.5

[radar]
; detection range (NM) for a head-on or tail-on target; beam aspect adds aspectGain (1..200)
detRangeNm=20
; detection range x (1 + aspectGain * sin^2(aspect)): beam targets are seen further (0..2)
aspectGain=0.25
; scan volume half-width left/right of the nose (deg) (5..89)
scanAzDeg=60
; scan volume half-height above/below the nose (deg) (5..89)
scanElDeg=45
; identification range (NM): ID after idSec of track inside it (0..200)
idRangeNm=15
; track time inside idRangeNm until unknown -> hostile (s) (0..30)
idSec=1.5
; instant identification inside this range (NM) (0..200)
idInstantNm=5
; not seen this long -> MEMORY (s) (0.1..10)
lostSec=0.5
; MEMORY (dashed, extrapolated) this long -> dropped (s) (0.5..120)
memorySec=6
; lock (STT) gimbal: max angle off the nose (deg) (5..180)
lockGimbalDeg=70
; lock range = lockRangeMul x the detection range (0.1..5)
lockRangeMul=1.2
; detection range of the PLAYER's radar head-on/tail (NM; x (1 + aspectGain sin^2 aspect)); enemies use detRangeNm (1..200)
playerDetRangeNm=40
; identification range of the PLAYER's radar (NM); enemies use idRangeNm (0..200)
playerIdRangeNm=25
; lock test failing this long -> lock MEMORY (s) (0.1..10)
lockLostSec=1.0
; lock MEMORY this long -> designation dropped (s) (0.1..30)
lockMemorySec=3.0
; displayed contact states/flags hold at least this long (s) (0..2)
latchSec=0.3
; dead contacts stay listed (SPLASH) this long (s) (0..10)
splashSec=2.0
; RWR: an SRM homing on the player gives MISSILE when launched inside or now within this range (m) (0..50000)
rwrSrmWarnM=5000
; S: contacts within this range (NM) can be selected (1..200)
selectRangeNm=40
; S taps closer together than this walk a frozen list (s); a later tap rebuilds it by angle off the nose (0.1..10)
cycleSec=2.0
; 1 = when the designated (or selected) contact dies, select the contact nearest the nose (0/1)
autoReselect=1
; 1 = after a kill also designate (lock) the newly selected contact (Ace Combat style) (0/1)
autoRedesignate=0

[lrm]
; s: free drop off the rail before the motor lights (0..2)
dropSec=0.15
; s: motor burn time (0..20)
boostSec=3.0
; m/s^2: motor acceleration (0..2000)
boostAcc=200
; 1/m: drag deceleration = dragK x rho x V^2 (0..0.01)
dragK=0.00009
; deceleration per m/s^2 of lateral acceleration (0..1)
inducedK=0.05
; g: lateral acceleration limit at/above gRefSpeed (1..100)
gMax=30
; m/s: below this the limit falls with (V/gRefSpeed)^2 (50..2000)
gRefSpeed=500
; proportional navigation constant (1..10)
navN=4.0
; deg: seeker gimbal limit (nose -> target) (5..90)
gimbalDeg=50
; deg: LRM active search cone / SRM lock circle at the boresight (0.5..90)
acqConeDeg=25
; m: LRM goes active when its estimated distance is below this (0..50000)
activeM=7000
; m: LRM seeker acquisition range (0..50000)
seekM=9000
; m: SRM heat lock range from behind the target (0..50000)
lockTailM=8000
; m: SRM heat lock range nose-on (0..50000)
lockHeadM=5000
; SRM lock range factor vs a target in afterburner (1..3)
abLockMul=1.2
; seeker keeps tracking out to acquisition range x this (1..5)
trackMul=1.5
; s: fuze arms after this (0..5)
armSec=1.3
; m: proximity fuze radius (1..100)
fuzeM=25
; s: self-destruct age (1..200)
maxSec=45
; m/s: dead below this after the boost (0..1000)
minSpeed=390
; hit damage vs an enemy (hit event; mission applies) (0..1000)
damageEnemy=100
; hit damage vs the player (hit event; mission applies) (0..1000)
damagePlayer=55
; s: straight flight after launch before guidance (0..3)
launchSec=0.3
; s: LRM without TD flies straight, then goes active (0..10)
maddogSec=1.5
; s: SRM fired without lock searches this long, then unguided (0..10)
searchSec=2.0
; deg: SRM search cone after a launch without lock (0.5..90)
searchConeDeg=12
; s: target outside gimbal/LOS this long = seeker lost (0..5)
lostSec=0.3
; s: lost seeker flies to the last known point, then unguided (0..10)
memSec=1.5
; s: seeker terrain LOS check period (0.01..1)
losSec=0.1
; 1 = drag x exp(-alt/8500) (0/1)
densityAlt=1
; augmented PN: x navN/2 x target acceleration (0 = pure PN) (0..3)
apnK=1.0
; g: extra climb acceleration in midcourse while far (0 = off) (0..10)
loftG=0
; m: loft only while the estimated distance > this (0..80000)
loftRangeM=12000

