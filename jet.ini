; fly-out step (s); 1/30 agrees with live 1/120 (T12) (0.004..0.05)
dt=0.0333333
; Rmax search ends when the hit/miss bracket is this narrow (fraction) (0.005..0.2)
tolMax=0.025
; Rne search bracket (fraction); Rne publishes the verified hit side (0.005..0.2)
tolNe=0.03
; Rmin search bracket (fraction, at least 25 m) (0.005..0.3)
tolMin=0.05
; next guess aims this fraction past the estimate (closes the bracket) (0..0.1)
padFrac=0.006
